<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { 
    getAuth, 
    onAuthStateChanged, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword, 
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCNxkZMnSXWP-kVuKGYUN7dOORC-Hb_4ko",
    authDomain: "noted-app-1a9c2.firebaseapp.com",
    projectId: "noted-app-1a9c2",
    storageBucket: "noted-app-1a9c2.firebasestorage.app",
    messagingSenderId: "688617687012",
    appId: "1:688617687012:web:05c8d00f5d1db3b429e9f1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  enableIndexedDbPersistence(db).catch((err) => {
    if (err.code == 'failed-precondition') console.warn('Persistence failed: Multiple tabs open');
    else if (err.code == 'unimplemented') console.warn('Persistence not supported');
  });

  window.firebaseDB = db;
  window.firebaseAuth = auth;
  window.firebaseApp = app;
  window.signInWithEmailAndPassword = signInWithEmailAndPassword;
  window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
  window.signOut = signOut;
</script>

  @media (max-width: 768px) { .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); width: 85%; max-width: 300px; box-shadow: var(--shadow-xl); z-index: 100; } .sidebar.open { transform: translateX(0); } .menu-toggle { display: flex; } .notes-list { position: absolute; inset: 0; width: 100%; transform: translateX(0); z-index: 5; } .notes-list.hidden-mobile { transform: translateX(-100%); } .back-toggle { display: flex; } .editor { position: absolute; inset: 0; transform: translateX(100%); transition: transform var(--transition-slow); z-index: 6; } .editor.active-mobile { transform: translateX(0); } .title-input { font-size: 26px; padding: 18px 18px 8px; } .meta-row, .tags-input { padding: 0 18px 12px; } .content-area { padding: 0 18px 60px; } .editor-header, .editor-toolbar, .status-bar { padding: 12px 16px; } .fab { display: flex; } .app { position: relative; overflow: hidden; } }
  @media (max-width: 480px) { .title-input { font-size: 24px; } .editor-textarea, .preview { font-size: 16px; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } } .note-card { animation: slideIn 0.2s ease backwards; } .note-card:nth-child(1) { animation-delay: 0s; } .note-card:nth-child(2) { animation-delay: 0.02s; } .note-card:nth-child(3) { animation-delay: 0.04s; } .note-card:nth-child(4) { animation-delay: 0.06s; } .note-card:nth-child(5) { animation-delay: 0.08s; } ::selection { background: var(--primary-light); color: var(--primary); } button:focus-visible, input:focus-visible, textarea:focus-visible { outline: none; box-shadow: none; }
  @media print { .sidebar, .notes-list, .editor-header, .editor-toolbar, .status-bar, .fab, .modal-overlay, .context-menu, .toast, .backdrop { display: none !important; } .app { display: block; height: auto; overflow: visible; } .editor { position: static !important; transform: none !important; width: 100% !important; height: auto !important; overflow: visible !important; box-shadow: none !important; } .editor-content { overflow: visible !important; } .content-area { overflow: visible !important; padding: 0 !important; } .title-input { font-size: 20pt !important; border: none !important; padding: 0 !important; margin-bottom: 6px !important; } .meta-row, .tags-input { display: none !important; } .editor-textarea { display: none !important; } .preview { display: block !important; font-size: 11pt !important; line-height: 1.5 !important; color: #000 !important; } body { background: white !important; color: black !important; } body::before { display: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>

      <button class="icon-btn" onclick="toggleTheme()" title="Ganti Tema" id="themeBtn">

    <div class="search-box">

        Catatan

      <button class="btn btn-secondary" onclick="createFolder()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Folder

    </div>

      </button>
      <button class="icon-btn" onclick="showExportModal()" title="Ekspor Data">

      </button>
      <button class="icon-btn" onclick="document.getElementById('importFile').click()" title="Import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>

      <!-- TOMBOL LOGOUT BARU -->

      </button>

  <div class="backdrop" id="backdrop" onclick="toggleSidebar(false)"></div>
  <section class="notes-list" id="notesList">
    <div class="notes-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="icon-btn menu-toggle" onclick="toggleSidebar(true)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <h2>Mulai Menulis</h2>
        <p>Pilih catatan dari daftar atau buat catatan baru untuk mulai menuangkan ide-ide kamu</p>
        <button class="btn btn-primary" onclick="createNote()" style="width: auto; padding: 10px 18px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Buat Catatan Baru

      </div>
      <div id="editorContent" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
        <div class="editor-toolbar" id="editorToolbar">
          <button class="tool-btn" onclick="insertMarkdown('**', '**')" title="Bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6zM6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg></button>
          <button class="tool-btn" onclick="insertMarkdown('*', '*')" title="Italic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></button>
          <button class="tool-btn" onclick="insertMarkdown('~~', '~~')" title="Strikethrough"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4M14 12a4 4 0 0 1 0 8H6M4 12h16"/></svg></button>
          <div class="tool-divider"></div>
          <button class="tool-btn" onclick="insertMarkdown('# ', '')" title="H1">H1</button>
          <button class="tool-btn" onclick="insertMarkdown('## ', '')" title="H2">H2</button>
          <button class="tool-btn" onclick="insertMarkdown('### ', '')" title="H3">H3</button>
          <div class="tool-divider"></div>
          <button class="tool-btn" onclick="insertMarkdown('- ', '')" title="List"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
          <button class="tool-btn" onclick="insertMarkdown('- [ ] ', '')" title="Checklist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>
          <div class="tool-divider"></div>

          <button class="tool-btn" onclick="insertMarkdown('`', '`')" title="Code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
          <button class="tool-btn" onclick="insertMarkdown('[', '](url)')" title="Link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
          <div class="tool-divider"></div>

          </div>

<button class="fab" onclick="fabAction()" id="fab" title="Buat">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<div class="context-menu" id="contextMenu"></div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast">
  <div class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><polyline points="20 6 9 17 7 15"/></svg></div>
  <span id="toastMsg">Berhasil</span>
</div>
<div class="drag-ghost" id="dragGhost"></div>

<script>
let state = { nodes: [], currentFolderId: null, currentNoteId: null, expanded: {}, theme: 'light', previewMode: false, filter: 'all', toolbarVisible: true };
let currentUserId = null;
let saveTimeout = null;
let isInitialLoad = true;

function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 9); }
function getNode(id) { return state.nodes.find(n => n.id === id); }
function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getDateStr() { return new Date().toISOString().split('T')[0]; }

// ========== FIREBASE INTEGRATION (EMAIL/PASSWORD) ==========
function setupFirebaseSync() {
  if (!window.firebaseAuth || !window.firebaseDB) {
    console.error("Firebase belum diinisialisasi.");
    return;
  }

  window.onAuthStateChanged(window.firebaseAuth, (user) => {
    if (user) {
      currentUserId = user.uid;
      document.getElementById('statusLeft').innerHTML = '<span class="status-dot"></span>Terhubung ke Cloud ✓';
      setupRealtimeListener();
    } else {
      // Jika belum login, tampilkan modal login
      showLoginModal();
    }
  });
}

function showLoginModal() {
  const modal = document.getElementById('modal');
  modal.innerHTML = `
    <h3>🔐 Login NotesApp Pro</h3>
    <p class="modal-subtitle">Masuk untuk menyinkronkan catatan Anda</p>
    <input type="email" id="loginEmail" placeholder="Alamat Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <div class="modal-actions" style="flex-direction: column; gap: 8px;">
      <button class="btn btn-primary" id="btnLogin" style="width: 100%;">Login</button>
      <button class="btn btn-secondary" id="btnRegister" style="width: 100%;">Daftar Akun Baru</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('active');

  document.getElementById('btnLogin').onclick = async () => {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    try {
      await window.signInWithEmailAndPassword(window.firebaseAuth, email, password);
      closeModal();
      showToast('Login berhasil!');
    } catch (error) {
      showToast('Login gagal: ' + error.message, 'error');
    }
  };

  document.getElementById('btnRegister').onclick = async () => {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    if (password.length < 6) {
      showToast('Password minimal 6 karakter', 'error');
      return;
    }
    try {
      await window.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
      closeModal();
      showToast('Akun berhasil dibuat!');
    } catch (error) {
      showToast('Pendaftaran gagal: ' + error.message, 'error');
    }
  };
}

function logout() {
  if(confirm('Yakin ingin logout?')) {
    window.signOut(window.firebaseAuth).then(() => {
      showToast('Berhasil logout');
      state.nodes = [];
      renderTree(); renderNotesList(); renderEditor();
    });
  }
}

function setupRealtimeListener() {
  const docRef = window.doc(window.firebaseDB, "users", currentUserId, "app_data", "notesapp_state");
  
  window.onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      const data = docSnap.data();
      state.nodes = data.nodes || [];
      state.expanded = data.expanded || {};
      state.theme = data.theme || 'light';
      
      if (isInitialLoad) {
        isInitialLoad = false;
        renderTree(); renderNotesList(); renderEditor(); applyTheme();
      } else {
        renderTree(); renderNotesList();
      }
    } else {
      initDefaultData();
    }
  });
}

function initDefaultData() {
  const wf = { id: uid(), type: 'folder', parentId: null, name: '📁 Panduan', createdAt: Date.now(), updatedAt: Date.now() };
  const wn = { id: uid(), type: 'note', parentId: wf.id, name: 'Selamat Datang di NotesApp Pro ☁️', content: `# Selamat Datang! \n\nAplikasi catatan modern dengan sinkronisasi **Firebase Cloud**.\n\n## ✨ Fitur Baru\n- ☁️ **Real-time Sync** antar perangkat\n- 📴 **Offline Support** (Data tersimpan lokal & sync saat online)\n- 🔒 **Aman** (Data terikat dengan akun Email Anda)\n\nSilakan coba buat catatan, lalu buka di tab/browser lain untuk melihat sinkronisasi langsung!`, tags: ['welcome'], pinned: true, createdAt: Date.now(), updatedAt: Date.now() };
  
  state.nodes = [wf, wn];
  state.expanded[wf.id] = true;
  state.currentFolderId = null; 
  state.currentNoteId = wn.id;
  
  saveData();
  renderTree(); renderNotesList(); renderEditor(); applyTheme();
}

function saveData() {
  if (!currentUserId || !window.firebaseDB) return;
  
  clearTimeout(saveTimeout);
  document.getElementById('statusLeft').innerHTML = '<span class="status-dot" style="background:var(--warning)"></span>Menyimpan...';
  
  saveTimeout = setTimeout(async () => {
    try {
      const docRef = window.doc(window.firebaseDB, "users", currentUserId, "app_data", "notesapp_state");
      await window.setDoc(docRef, {
        nodes: state.nodes,
        expanded: state.expanded,
        theme: state.theme,
        updatedAt: Date.now()
      });
      document.getElementById('statusLeft').innerHTML = '<span class="status-dot"></span>Tersimpan di Cloud ✓';
    } catch (e) {
      console.error("Error saving to Firestore: ", e);
      document.getElementById('statusLeft').innerHTML = '<span class="status-dot" style="background:var(--danger)"></span>Gagal menyimpan';
      showToast("Gagal menyimpan ke cloud", "error");
    }
  }, 800);
}

function downloadFile(content, filename, type) { const blob = new Blob([content], { type: type }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url); }
function showExportModal() { const modal = document.getElementById('modal'); modal.innerHTML = `<h3>Ekspor Data</h3><p class="modal-subtitle">Pilih format file yang diinginkan</p><button class="btn btn-secondary" style="width:100%; margin-bottom:6px; justify-content:flex-start;" onclick="exportAsJSON()">📄 JSON (Backup Lengkap)</button><button class="btn btn-secondary" style="width:100%; margin-bottom:6px; justify-content:flex-start;" onclick="exportAsTXT()">📝 TXT (Semua Catatan)</button><button class="btn btn-secondary" style="width:100%; margin-bottom:6px; justify-content:flex-start;" onclick="exportAsCSV()">📊 CSV (Data Tabel)</button><button class="btn btn-secondary" style="width:100%; justify-content:flex-start;" onclick="exportAsPDF()">🖨️ PDF (Print)</button><div class="modal-actions" style="margin-top: 12px;"><button class="btn btn-secondary" onclick="closeModal()">Batal</button></div>`; document.getElementById('modalOverlay').classList.add('active'); }
function exportAsJSON() { downloadFile(JSON.stringify(state, null, 2), `notesapp-backup-${getDateStr()}.json`, 'application/json'); closeModal(); showToast('Berhasil diekspor ke JSON'); }
function exportAsTXT() { let txt = "NOTESAPP PRO EXPORT\nGenerated: " + new Date().toLocaleString('id-ID') + "\n" + "=".repeat(50) + "\n\n"; const buildTxt = (node, depth) => { const indent = "  ".repeat(depth); if (node.type === 'folder') { txt += `${indent}📁 ${node.name}\n`; const children = state.nodes.filter(n => !n.trashed && n.parentId === node.id); children.forEach(child => buildTxt(child, depth + 1)); } else { txt += `${indent}📝 ${node.name}\n`; txt += `${indent}   Tags: ${(node.tags || []).join(', ') || 'Tidak ada'}\n`; txt += `${indent}   ${"-".repeat(40)}\n`; txt += `${indent}   ${node.content || '(Kosong)'}\n`; txt += `${indent}   ${"-".repeat(40)}\n\n`; } }; const roots = state.nodes.filter(n => !n.trashed && n.parentId === null); roots.forEach(root => buildTxt(root, 0)); downloadFile(txt, `notesapp-export-${getDateStr()}.txt`, 'text/plain'); closeModal(); showToast('Berhasil diekspor ke TXT'); }
function exportFolder(folderId) { const folder = getNode(folderId); if (!folder) return; let txt = `FOLDER: ${folder.name}\nExported: ${new Date().toLocaleString('id-ID')}\n${"=".repeat(50)}\n\n`; const collectNotes = (parentId, depth) => { const children = state.nodes.filter(n => !n.trashed && n.parentId === parentId); children.forEach(child => { if (child.type === 'folder') { txt += "  ".repeat(depth) + `📁 ${child.name}\n`; collectNotes(child.id, depth + 1); } else { txt += "  ".repeat(depth) + `📝 ${child.name}\n`; txt += "  ".repeat(depth) + `   Tags: ${(child.tags || []).join(', ') || 'Tidak ada'}\n`; txt += "  ".repeat(depth) + `   ${"-".repeat(30)}\n${"  ".repeat(depth)}   ${child.content || '(Kosong)'}\n`; txt += "  ".repeat(depth) + `   ${"-".repeat(30)}\n\n`; } }); }; collectNotes(folderId, 0); downloadFile(txt, `folder-${folder.name.replace(/[^a-z0-9]/gi, '_')}-${getDateStr()}.txt`, 'text/plain'); showToast(`Folder "${folder.name}" berhasil didownload`); }
function exportNote(noteId) { const note = getNode(noteId); if (!note || note.type !== 'note') return; let txt = `JUDUL: ${note.name}\nTags: ${(note.tags || []).join(', ')}\nDibuat: ${new Date(note.createdAt).toLocaleString('id-ID')}\nTerakhir diubah: ${new Date(note.updatedAt).toLocaleString('id-ID')}\n${"=".repeat(50)}\n\n${note.content || '(Kosong)'}`; downloadFile(txt, `note-${note.name.replace(/[^a-z0-9]/gi, '_')}-${getDateStr()}.txt`, 'text/plain'); showToast(`Catatan "${note.name}" berhasil didownload`); }
function exportAsCSV() { let csv = "ID,Type,Name,ParentID,Tags,CreatedAt,UpdatedAt,Content\n"; state.nodes.filter(n => !n.trashed).forEach(n => { const name = `"${(n.name || '').replace(/"/g, '""')}"`; const tags = `"${(n.tags || []).join(',')}"`; const content = `"${(n.content || '').replace(/"/g, '""').replace(/\n/g, ' ')}"`; csv += `${n.id},${n.type},${name},${n.parentId || ''},${tags},${n.createdAt},${n.updatedAt},${content}\n`; }); downloadFile(csv, `notesapp-export-${getDateStr()}.csv`, 'text/csv'); closeModal(); showToast('Berhasil diekspor ke CSV'); }
function exportAsPDF() { closeModal(); const wasPreview = state.previewMode; if (!wasPreview) togglePreview(); setTimeout(() => { window.print(); if (!wasPreview) togglePreview(); }, 300); }
function importData(e) { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const data = JSON.parse(ev.target.result); if (!data.nodes) throw new Error('Format tidak valid'); if (!confirm('Import akan mengganti semua data saat ini di cloud. Lanjutkan?')) return; state = { ...state, ...data }; saveData(); renderTree(); renderNotesList(); renderEditor(); showToast('Data berhasil diimpor ke Cloud'); } catch(err) { showToast('File tidak valid', 'error'); } }; reader.readAsText(file); e.target.value = ''; }
function renderTree() { const container = document.getElementById('treeContainer'); const query = document.getElementById('searchInput').value.toLowerCase().trim(); let nodes = state.nodes.filter(n => !n.trashed); if (query) nodes = nodes.filter(n => n.name.toLowerCase().includes(query) || (n.content && n.content.toLowerCase().includes(query))); const roots = nodes.filter(n => n.parentId === null); if (query) { container.innerHTML = nodes.map(n => renderTreeItem(n, 0, true)).join(''); } else { const allCount = state.nodes.filter(n => !n.trashed && n.type === 'note').length; let html = `<div class="tree-item ${state.currentFolderId === null ? 'active' : ''}" data-id="__all__" data-type="virtual"><div class="toggle-placeholder"></div><div class="item-icon note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="item-name">Semua Catatan</div><div class="item-count">${allCount}</div></div>`; const pinnedCount = state.nodes.filter(n => !n.trashed && n.type === 'note' && n.pinned).length; if (pinnedCount > 0) { html += `<div class="tree-item ${state.currentFolderId === '__pinned__' ? 'active' : ''}" data-id="__pinned__" data-type="virtual"><div class="toggle-placeholder"></div><div class="item-icon" style="color: var(--accent-amber);"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 7h3l-5 7-5-7h3z"/></svg></div><div class="item-name">Dipin</div><div class="item-count">${pinnedCount}</div></div>`; } html += roots.map(n => renderTreeItem(n, 0)).join(''); container.innerHTML = html; } if (container.innerHTML === '') container.innerHTML = '<div style="padding: 18px; text-align: center; color: var(--text-muted); font-size: 14px;">Belum ada folder</div>'; attachTreeEvents(); }
function renderTreeItem(node, depth, flat = false) { const isFolder = node.type === 'folder'; const isExpanded = state.expanded[node.id]; const isActive = state.currentFolderId === node.id; const children = flat ? [] : state.nodes.filter(n => n.parentId === node.id && !n.trashed); const count = isFolder ? state.nodes.filter(n => n.parentId === node.id && !n.trashed && n.type === 'note').length : 0; const icon = isFolder ? `<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`; let html = `<div class="tree-item ${isActive ? 'active' : ''}" data-id="${node.id}" data-type="${node.type}" draggable="${isFolder}">`; if (isFolder && !flat) html += `<div class="toggle-btn ${isExpanded ? 'expanded' : ''}" data-toggle="${node.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>`; else html += '<div class="toggle-placeholder"></div>'; html += `<div class="item-icon ${isFolder ? 'folder' : 'note'}">${icon}</div><div class="item-name">${escapeHtml(node.name)}</div>`; if (isFolder && count > 0 && !flat) html += `<div class="item-count">${count}</div>`; if (node.pinned && !isFolder) html += '<div class="item-pin">⭐</div>'; html += '</div>'; if (isFolder && isExpanded && children.length > 0 && !flat) { html += `<div class="tree-children">`; children.forEach(c => { html += renderTreeItem(c, depth + 1); }); html += '</div>'; } return html; }
function attachTreeEvents() { document.querySelectorAll('.tree-item').forEach(el => { const id = el.dataset.id, type = el.dataset.type; el.addEventListener('click', (e) => { if (e.target.closest('.toggle-btn')) return; if (type === 'virtual') { state.currentFolderId = id; state.currentNoteId = null; saveData(); renderTree(); renderNotesList(); renderEditor(); if (window.innerWidth <= 768) toggleSidebar(false); } else selectNode(id); }); el.addEventListener('contextmenu', (e) => { if (type !== 'virtual') { e.preventDefault(); showContextMenu(e.clientX, e.clientY, id); } }); let pressTimer; el.addEventListener('touchstart', (e) => { pressTimer = setTimeout(() => { if (type !== 'virtual') showContextMenu(e.touches[0].clientX, e.touches[0].clientY, id); }, 600); }); el.addEventListener('touchend', () => clearTimeout(pressTimer)); el.addEventListener('touchmove', () => clearTimeout(pressTimer)); if (type === 'folder') { el.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', id); el.classList.add('dragging'); const g = document.getElementById('dragGhost'); g.textContent = getNode(id).name; g.style.display = 'block'; g.style.left = '-9999px'; e.dataTransfer.setDragImage(g, 10, 10); }); el.addEventListener('dragend', () => { el.classList.remove('dragging'); document.getElementById('dragGhost').style.display = 'none'; document.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over')); }); el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drag-over'); }); el.addEventListener('dragleave', () => el.classList.remove('drag-over')); el.addEventListener('drop', (e) => { e.preventDefault(); el.classList.remove('drag-over'); moveNode(e.dataTransfer.getData('text/plain'), id); }); } }); document.querySelectorAll('.toggle-btn').forEach(el => { el.addEventListener('click', (e) => { e.stopPropagation(); state.expanded[el.dataset.toggle] = !state.expanded[el.dataset.toggle]; saveData(); renderTree(); }); }); }
function renderNotesList() { const scroll = document.getElementById('notesScroll'); const titleEl = document.getElementById('notesTitle'); const subtitleEl = document.getElementById('notesSubtitle'); let notes = state.nodes.filter(n => !n.trashed && n.type === 'note'); let folderTitle = 'Semua Catatan'; if (state.currentFolderId === '__pinned__') { notes = notes.filter(n => n.pinned); folderTitle = '⭐ Dipin'; } else if (state.currentFolderId && state.currentFolderId !== '__all__') { const folder = getNode(state.currentFolderId); if (folder) { notes = notes.filter(n => isDescendantOf(n.id, state.currentFolderId)); folderTitle = folder.name; } } if (state.filter === 'pinned') notes = notes.filter(n => n.pinned); else if (state.filter === 'recent') { notes.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); notes = notes.slice(0, 20); } else notes.sort((a, b) => { if (a.pinned !== b.pinned) return b.pinned ? 1 : -1; return (b.updatedAt || 0) - (a.updatedAt || 0); }); titleEl.textContent = folderTitle; subtitleEl.textContent = `${notes.length} catatan`; if (notes.length === 0) { scroll.innerHTML = `<div class="empty-list"><div class="empty-list-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><h3>Belum ada catatan</h3><p>Buat catatan pertamamu</p></div>`; return; } scroll.innerHTML = notes.map(n => { const preview = (n.content || '').replace(/[#*`>\[\]()]/g, '').substring(0, 100); const time = formatTime(n.updatedAt); const tags = (n.tags || []).slice(0, 2).map(t => `<span class="note-card-tag">${escapeHtml(t)}</span>`).join(''); return `<div class="note-card ${state.currentNoteId === n.id ? 'active' : ''}" data-id="${n.id}" onclick="selectNote('${n.id}')"><div class="note-card-title">${n.pinned ? '<span class="note-card-pin">⭐</span>' : ''}${escapeHtml(n.name || 'Tanpa Judul')}</div><div class="note-card-preview">${escapeHtml(preview) || 'Tidak ada konten'}</div><div class="note-card-meta"><span>${time}</span>${tags}</div></div>`; }).join(''); }
function isDescendantOf(noteId, folderId) { let current = getNode(noteId)?.parentId; while (current) { if (current === folderId) return true; current = getNode(current)?.parentId; } return false; }
function setFilter(f) { state.filter = f; document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f)); renderNotesList(); }
function selectNote(id) { state.currentNoteId = id; saveData(); renderNotesList(); renderEditor(); if (window.innerWidth <= 768) document.getElementById('editor').classList.add('active-mobile'); }
function closeEditorMobile() { document.getElementById('editor').classList.remove('active-mobile'); }
function selectNode(id) { const node = getNode(id); if (!node) return; state.currentFolderId = id; if (node.type === 'folder') state.expanded[id] = true; const firstNote = state.nodes.find(n => !n.trashed && n.type === 'note' && n.parentId === id); state.currentNoteId = firstNote ? firstNote.id : null; saveData(); renderTree(); renderNotesList(); renderEditor(); if (window.innerWidth <= 768) toggleSidebar(false); }
function createNote() { let parentId = null; if (state.currentFolderId && !['__all__', '__pinned__'].includes(state.currentFolderId)) { const c = getNode(state.currentFolderId); if (c?.type === 'folder') parentId = c.id; } else if (state.currentNoteId) { const c = getNode(state.currentNoteId); if (c) parentId = c.parentId; } const note = { id: uid(), type: 'note', parentId, name: 'Catatan Baru', content: '', tags: [], pinned: false, createdAt: Date.now(), updatedAt: Date.now() }; state.nodes.push(note); state.currentNoteId = note.id; saveData(); renderTree(); renderNotesList(); renderEditor(); setTimeout(() => { const ti = document.getElementById('titleInput'); if (ti) { ti.focus(); ti.select(); } }, 100); showToast('Catatan dibuat'); if (window.innerWidth <= 768) document.getElementById('editor').classList.add('active-mobile'); }
function createFolder() { let parentId = null; if (state.currentFolderId && !['__all__', '__pinned__'].includes(state.currentFolderId)) { const c = getNode(state.currentFolderId); if (c?.type === 'folder') parentId = c.id; } showModal('Folder Baru', 'Buat folder untuk mengorganisir', 'Nama folder', 'Folder Baru', (name) => { if (!name.trim()) return; const folder = { id: uid(), type: 'folder', parentId, name: name.trim(), createdAt: Date.now(), updatedAt: Date.now() }; state.nodes.push(folder); state.expanded[folder.id] = true; state.currentFolderId = folder.id; saveData(); renderTree(); renderNotesList(); renderEditor(); showToast('Folder dibuat'); }); }
function moveNode(sourceId, targetId) { if (!sourceId || !targetId || sourceId === targetId) return; const source = getNode(sourceId), target = getNode(targetId); if (!source || !target || target.type !== 'folder') { showToast('Target harus folder', 'error'); return; } let check = targetId; while (check) { if (check === sourceId) { showToast('Tidak bisa memindahkan ke dalam dirinya sendiri', 'error'); return; } check = getNode(check)?.parentId; } source.parentId = targetId; source.updatedAt = Date.now(); state.expanded[targetId] = true; saveData(); renderTree(); renderNotesList(); showToast('Dipindahkan'); }
function deleteNode(id) { const node = getNode(id); if (!node) return; if (node.trashed) { const toDelete = [id]; const collect = (pid) => { state.nodes.filter(n => n.parentId === pid).forEach(n => { toDelete.push(n.id); if (n.type === 'folder') collect(n.id); }); }; if (node.type === 'folder') collect(id); state.nodes = state.nodes.filter(n => !toDelete.includes(n.id)); if (state.currentNoteId && toDelete.includes(state.currentNoteId)) state.currentNoteId = null; if (state.currentFolderId && toDelete.includes(state.currentFolderId)) state.currentFolderId = null; showToast('Dihapus permanen'); } else { node.trashed = true; node.trashedAt = Date.now(); const mark = (pid) => { state.nodes.filter(n => n.parentId === pid).forEach(n => { n.trashed = true; n.trashedAt = Date.now(); if (n.type === 'folder') mark(n.id); }); }; if (node.type === 'folder') mark(id); if (state.currentNoteId === id) state.currentNoteId = null; if (state.currentFolderId === id) state.currentFolderId = null; showToast('Dipindahkan ke sampah'); } saveData(); renderTree(); renderNotesList(); renderEditor(); }
function restoreNode(id) { const node = getNode(id); if (!node) return; const restore = (n) => { n.trashed = false; delete n.trashedAt; state.nodes.filter(c => c.parentId === n.id).forEach(restore); }; restore(node); saveData(); renderTree(); renderNotesList(); showToast('Dipulihkan'); }
function renameNode(id) { const node = getNode(id); if (!node) return; showModal('Ubah Nama', `Ubah nama ${node.type === 'folder' ? 'folder' : 'catatan'}`, 'Nama baru', node.name, (name) => { if (!name.trim()) return; node.name = name.trim(); node.updatedAt = Date.now(); saveData(); renderTree(); renderNotesList(); renderEditor(); }); }
function togglePinNode(id) { const node = getNode(id); if (!node || node.type !== 'note') return; node.pinned = !node.pinned; node.updatedAt = Date.now(); saveData(); renderTree(); renderNotesList(); renderEditor(); showToast(node.pinned ? 'Dipin ⭐' : 'Unpin'); }
function duplicateNode(id) { const node = getNode(id); if (!node) return; const clone = JSON.parse(JSON.stringify(node)); clone.id = uid(); clone.name = node.name + ' (salinan)'; clone.createdAt = Date.now(); clone.updatedAt = Date.now(); const cloneChildren = (oldPid, newPid) => { state.nodes.filter(n => n.parentId === oldPid).forEach(child => { const cc = JSON.parse(JSON.stringify(child)); const newId = uid(); const oldId = cc.id; cc.id = newId; cc.parentId = newPid; cc.createdAt = Date.now(); cc.updatedAt = Date.now(); state.nodes.push(cc); if (cc.type === 'folder') cloneChildren(oldId, newId); }); }; state.nodes.push(clone); if (clone.type === 'folder') cloneChildren(node.id, clone.id); state.currentNoteId = clone.type === 'note' ? clone.id : state.currentNoteId; state.currentFolderId = clone.type === 'folder' ? clone.id : state.currentFolderId; saveData(); renderTree(); renderNotesList(); renderEditor(); showToast('Diduplikat'); }
function renderEditor() { const empty = document.getElementById('emptyState'), content = document.getElementById('editorContent'); const node = state.currentNoteId ? getNode(state.currentNoteId) : null; if (!node || node.type !== 'note') { empty.style.display = 'flex'; content.style.display = 'none'; updateBreadcrumb(); updateStatus(); return; } empty.style.display = 'none'; content.style.display = 'flex'; document.getElementById('titleInput').value = node.name; document.getElementById('tagsInput').value = (node.tags || []).join(', '); document.getElementById('contentInput').value = node.content || ''; document.getElementById('pinBtn').style.color = node.pinned ? 'var(--accent-amber)' : ''; updateBreadcrumb(); updateStatus(); updatePreview(); }
function updateNote() { const node = getNode(state.currentNoteId); if (!node || node.type !== 'note') return; node.name = document.getElementById('titleInput').value || 'Tanpa Judul'; node.content = document.getElementById('contentInput').value; node.tags = document.getElementById('tagsInput').value.split(',').map(t => t.trim()).filter(t => t); node.updatedAt = Date.now(); saveData(); renderNotesList(); renderTree(); updateBreadcrumb(); updateStatus(); updatePreview(); }
function updateBreadcrumb() { const bc = document.getElementById('breadcrumb'); const node = state.currentNoteId ? getNode(state.currentNoteId) : null; if (!node) { bc.innerHTML = '<span class="breadcrumb-item current">NotesApp Pro</span>'; return; } const path = []; let current = node; while (current) { path.unshift(current); current = current.parentId ? getNode(current.parentId) : null; } bc.innerHTML = '<span class="breadcrumb-item" onclick="state.currentNoteId=null;renderNotesList();renderEditor();"> Root</span>' + path.map((p, i) => `<span class="breadcrumb-sep">›</span><span class="breadcrumb-item ${i === path.length - 1 ? 'current' : ''}" onclick="selectNode('${p.id}')">${escapeHtml(p.name)}</span>`).join(''); }
function updateStatus() { const node = getNode(state.currentNoteId); if (!node) { document.getElementById('statusLeft').innerHTML = '<span class="status-dot"></span>Siap'; document.getElementById('statusRight').textContent = `${state.nodes.filter(n=>!n.trashed).length} item`; return; } const chars = (node.content || '').length; const words = (node.content || '').trim() ? (node.content || '').trim().split(/\s+/).length : 0; document.getElementById('metaTime').textContent = formatTime(node.updatedAt); document.getElementById('metaStats').textContent = `${words} kata • ${chars} karakter`; document.getElementById('metaRead').textContent = `~${Math.max(1, Math.ceil(words / 200))} min read`; }
function updatePreview() { if (!state.previewMode) return; document.getElementById('previewContent').innerHTML = renderMarkdown(document.getElementById('contentInput').value); }
function togglePreview() { state.previewMode = !state.previewMode; const btn = document.getElementById('previewBtn'), ta = document.getElementById('contentInput'), pv = document.getElementById('previewContent'); if (state.previewMode) { btn.classList.add('active'); ta.style.display = 'none'; pv.style.display = 'block'; updatePreview(); } else { btn.classList.remove('active'); ta.style.display = 'block'; pv.style.display = 'none'; } }
function togglePin() { const node = getNode(state.currentNoteId); if (node) togglePinNode(node.id); }
function insertMarkdown(before, after) { const ta = document.getElementById('contentInput'); if (!ta) return; const start = ta.selectionStart, end = ta.selectionEnd, text = ta.value; const selected = text.substring(start, end); ta.value = text.substring(0, start) + before + selected + after + text.substring(end); ta.focus(); ta.setSelectionRange(start + before.length, start + before.length + selected.length); updateNote(); }
function renderMarkdown(text) { if (!text) return '<p style="color:var(--text-muted); font-style:italic;">Tidak ada konten</p>'; let html = escapeHtml(text); html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>'); html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>'); html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h1>$1</h1>'); html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/~~([^~]+)~~/g, '<del>$1</del>'); html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>'); html = html.replace(/^- \[x\] (.+)$/gm, '<li style="list-style:none;"><input type="checkbox" checked disabled> $1</li>'); html = html.replace(/^- \[ \] (.+)$/gm, '<li style="list-style:none;"><input type="checkbox" disabled> $1</li>'); html = html.replace(/^- (.+)$/gm, '<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>'); html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>').replace(/^---$/gm, '<hr>'); html = html.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>'); html = '<p>' + html + '</p>'; html = html.replace(/<p><\/p>/g, ''); ['h1','h2','h3','ul','ol','pre','blockquote','hr'].forEach(tag => { html = html.replace(new RegExp(`<p><${tag}`, 'g'), `<${tag}`).replace(new RegExp(`</${tag}></p>`, 'g'), `</${tag}>`); }); return html; }
function showContextMenu(x, y, id) { const node = getNode(id); if (!node) return; const menu = document.getElementById('contextMenu'); let items = ''; if (node.trashed) { items = `<div class="context-item" onclick="restoreNode('${id}');hideContextMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Pulihkan</div><div class="context-item danger" onclick="deleteNode('${id}');hideContextMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Hapus Permanen</div>`; } else { items = `<div class="context-item" onclick="renameNode('${id}');hideContextMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Ubah Nama</div>`; if (node.type === 'note') { items += `<div class="context-item" onclick="togglePinNode('${id}');hideContextMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 7h3l-5 7-5-7h3z"/></svg>${node.pinned ? 'Unpin' : 'Pin'}</div>`; items += `<div class="context-item" onclick="exportNote('${id}');hideContextMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Download Catatan</div>`; } if (node.type === 'folder') { items += `<div class="context-item" onclick="createNoteIn('${id}');hideContextMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Catatan Baru</div><div class="context-item" onclick="createSubFolder('${id}');hideContextMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Subfolder</div>`; items += `<div class="context-item" onclick="exportFolder('${id}');hideContextMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Download Folder</div>`; } items += `<div class="context-sep"></div><div class="context-item" onclick="duplicateNode('${id}');hideContextMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Duplikat</div><div class="context-item danger" onclick="deleteNode('${id}');hideContextMenu()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Hapus</div>`; } menu.innerHTML = items; menu.classList.add('active'); const mw = menu.offsetWidth, mh = menu.offsetHeight, wx = window.innerWidth, wy = window.innerHeight; menu.style.left = Math.min(x, wx - mw - 10) + 'px'; menu.style.top = Math.min(y, wy - mh - 10) + 'px'; }
function hideContextMenu() { document.getElementById('contextMenu').classList.remove('active'); }
function createNoteIn(folderId) { const note = { id: uid(), type: 'note', parentId: folderId, name: 'Catatan Baru', content: '', tags: [], pinned: false, createdAt: Date.now(), updatedAt: Date.now() }; state.nodes.push(note); state.currentNoteId = note.id; state.currentFolderId = folderId; state.expanded[folderId] = true; saveData(); renderTree(); renderNotesList(); renderEditor(); setTimeout(() => { const ti = document.getElementById('titleInput'); if (ti) { ti.focus(); ti.select(); } }, 100); if (window.innerWidth <= 768) document.getElementById('editor').classList.add('active-mobile'); }
function createSubFolder(parentId) { showModal('Subfolder Baru', 'Buat subfolder di dalam folder ini', 'Nama subfolder', 'Subfolder Baru', (name) => { if (!name.trim()) return; const folder = { id: uid(), type: 'folder', parentId, name: name.trim(), createdAt: Date.now(), updatedAt: Date.now() }; state.nodes.push(folder); state.expanded[parentId] = true; state.expanded[folder.id] = true; saveData(); renderTree(); renderNotesList(); showToast('Subfolder dibuat'); }); }
function showMoreMenu(e) { e.preventDefault(); e.stopPropagation(); const node = getNode(state.currentNoteId); if (!node) return; let x, y; if (e.touches && e.touches.length > 0) { x = e.touches[0].clientX; y = e.touches[0].clientY; } else if (e.clientX !== undefined && e.clientX !== 0) { x = e.clientX; y = e.clientY; } else { const btn = document.getElementById('moreMenuBtn'); const rect = btn.getBoundingClientRect(); x = rect.right; y = rect.bottom; } showContextMenu(x, y, node.id); }
function showTrash() { const trashed = state.nodes.filter(n => n.trashed); if (trashed.length === 0) { showToast('Sampah kosong'); return; } let items = trashed.map(n => `<div style="padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px;"><div style="flex:1; overflow:hidden;"><div style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px;">${escapeHtml(n.name)}</div><div style="font-size:12px; color:var(--text-muted);">${n.type === 'folder' ? 'Folder' : 'Catatan'} • ${formatTime(n.trashedAt)}</div></div><button class="icon-btn" onclick="restoreNode('${n.id}');closeModal();showTrash();" title="Pulihkan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button><button class="icon-btn" style="color:var(--danger);" onclick="deleteNode('${n.id}');closeModal();showTrash();" title="Hapus Permanen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>`).join(''); document.getElementById('modal').innerHTML = `<h3>🗑️ Sampah</h3><p class="modal-subtitle">${trashed.length} item di sampah</p><div style="max-height: 350px; overflow-y: auto;">${items}</div><div class="modal-actions" style="margin-top: 12px;"><button class="btn btn-secondary" onclick="closeModal()">Tutup</button><button class="btn btn-primary" style="background: var(--danger);" onclick="emptyTrash()">Kosongkan</button></div>`; document.getElementById('modalOverlay').classList.add('active'); }
function emptyTrash() { if (!confirm('Hapus semua item di sampah secara permanen?')) return; state.nodes = state.nodes.filter(n => !n.trashed); saveData(); closeModal(); renderTree(); renderNotesList(); renderEditor(); showToast('Sampah dikosongkan'); }
function showModal(title, subtitle, placeholder, defaultValue, onConfirm) { const modal = document.getElementById('modal'); modal.innerHTML = `<h3>${title}</h3><p class="modal-subtitle">${subtitle}</p><input type="text" id="modalInput" placeholder="${placeholder}" value="${escapeHtml(defaultValue || '')}"><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Batal</button><button class="btn btn-primary" id="modalConfirm">Simpan</button></div>`; document.getElementById('modalOverlay').classList.add('active'); const input = document.getElementById('modalInput'); setTimeout(() => { input.focus(); input.select(); }, 50); document.getElementById('modalConfirm').onclick = () => { onConfirm(input.value); closeModal(); }; input.onkeydown = (e) => { if (e.key === 'Enter') { onConfirm(input.value); closeModal(); } if (e.key === 'Escape') closeModal(); }; }
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
function toggleTheme() { state.theme = state.theme === 'light' ? 'dark' : 'light'; saveData(); applyTheme(); }
function applyTheme() { document.documentElement.setAttribute('data-theme', state.theme); const icon = document.getElementById('themeIcon'); icon.innerHTML = state.theme === 'dark' ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>' : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'; }
function toggleSidebar(force) { const sb = document.getElementById('sidebar'), bd = document.getElementById('backdrop'); const shouldOpen = force !== undefined ? force : !sb.classList.contains('open'); if (shouldOpen) { sb.classList.add('open'); bd.classList.add('active'); } else { sb.classList.remove('open'); bd.classList.remove('active'); } }
function handleSearch() { renderTree(); }
function toggleToolbar() { state.toolbarVisible = !state.toolbarVisible; saveData(); updateToolbarVisibility(); }
function updateToolbarVisibility() { const toolbar = document.getElementById('editorToolbar'), btn = document.getElementById('toolbarToggleBtn'), icon = document.getElementById('toolbarToggleIcon'); if (state.toolbarVisible) { toolbar.classList.remove('hidden'); btn.title = 'Sembunyikan Toolbar'; icon.innerHTML = '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>'; } else { toolbar.classList.add('hidden'); btn.title = 'Tampilkan Toolbar'; icon.innerHTML = '<rect x="2" y="4" width="20" height="16" rx="2" ry="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M6 16h12"/>'; } }
function formatTime(ts) { if (!ts) return 'Baru saja'; const diff = Date.now() - ts, mins = Math.floor(diff / 60000), hours = Math.floor(diff / 3600000), days = Math.floor(diff / 86400000); if (mins < 1) return 'Baru saja'; if (mins < 60) return `${mins}m lalu`; if (hours < 24) return `${hours}j lalu`; if (days < 7) return `${days}h lalu`; const d = new Date(ts); return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined }); }
function showToast(msg, type = 'success') { const t = document.getElementById('toast'), msgEl = document.getElementById('toastMsg'); msgEl.textContent = msg; t.className = `toast ${type}`; t.querySelector('.toast-icon').innerHTML = type === 'error' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><polyline points="20 6 9 17 7 15"/></svg>'; setTimeout(() => t.classList.add('show'), 10); setTimeout(() => t.classList.remove('show'), 2500); }
function fabAction() { if (window.innerWidth <= 768) { document.getElementById('modal').innerHTML = `<h3>Buat Baru</h3><p class="modal-subtitle">Pilih jenis item</p><button class="btn btn-primary" style="width:100%; margin-bottom:6px;" onclick="createNote(); closeModal();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Catatan Baru</button><button class="btn btn-secondary" style="width:100%;" onclick="createFolder(); closeModal();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>Folder Baru</button>`; document.getElementById('modalOverlay').classList.add('active'); } }
function setupGlobalEvents() { document.addEventListener('click', (e) => { if (!e.target.closest('.context-menu')) hideContextMenu(); }); document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); createNote(); } if ((e.ctrlKey || e.metaKey) && e.key === 'b' && document.activeElement === document.getElementById('contentInput')) { e.preventDefault(); insertMarkdown('**', '**'); } if ((e.ctrlKey || e.metaKey) && e.key === 'i' && document.activeElement === document.getElementById('contentInput')) { e.preventDefault(); insertMarkdown('*', '*'); } if (e.key === 'Escape') { hideContextMenu(); closeModal(); } }); }

// Jalankan inisialisasi
setupFirebaseSync();
setupGlobalEvents();
</script>
